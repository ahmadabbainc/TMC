name = "tmc-edge-api"
main = "src/index.ts"
compatibility_date = "2026-11-21"

[[r2_buckets]]
binding = "TMC_BUCKET"
bucket_name = "tmc-videos"

[vars]
APP_ORIGIN = "https://tmc.pages.dev"
GITHUB_OWNER = "ahmadabbainc"
GITHUB_REPO = "TMC"
GITHUB_WORKFLOW = "process-video.yml"
GITHUB_BRANCH = "feat/tmc-backend-foundation"
MAX_UPLOAD_BYTES = "200000000"

[triggers]
crons = ["0 3 * * *"]
