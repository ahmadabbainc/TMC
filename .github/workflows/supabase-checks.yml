name: TMC Supabase function checks

on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-checks.yml"
  push:
    branches:
      - main
      - "feat/**"
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-checks.yml"

permissions:
  contents: read

jobs:
  edge-function:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install Supabase function dependencies
        run: deno cache --config supabase/deno.json supabase/functions/tmc-api/index.ts
      - name: Type-check Supabase Edge Function
        run: deno check --config supabase/deno.json supabase/functions/tmc-api/index.ts
      - name: Compile Python processing helpers
        run: python -m compileall -q backend/process_action.py backend/cleanup_storage.py
