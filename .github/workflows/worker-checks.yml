name: TMC Cloudflare Worker checks

on:
  pull_request:
    paths:
      - "cloudflare/worker/**"
      - ".github/workflows/worker-checks.yml"
  push:
    branches:
      - main
      - "feat/**"
    paths:
      - "cloudflare/worker/**"
      - ".github/workflows/worker-checks.yml"

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Worker bundle
        run: npx wrangler deploy --dry-run --outdir=dist
