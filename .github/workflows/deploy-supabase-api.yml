name: Deploy TMC Supabase API

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/tmc-api/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase-api.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0
      - name: Link Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Apply database migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --remote --yes
      - name: Deploy API function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy tmc-api --no-verify-jwt --yes

      - name: Diagnose Storage browser upload CORS
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          set -eu
          echo "Checking Supabase Storage preflight for the production website..."
          curl --silent --show-error --include --max-time 20 --request OPTIONS \
            "${SUPABASE_URL}/storage/v1/object/upload/sign/tmc-videos/cors-probe.mp4?token=probe" \
            --header "Origin: https://tmcs-cyan.vercel.app" \
            --header "Access-Control-Request-Method: PUT" \
            --header "Access-Control-Request-Headers: content-type" \
            --output /tmp/storage-preflight.txt
          cat /tmp/storage-preflight.txt
          grep -qi "access-control-allow-origin" /tmp/storage-preflight.txt
          grep -qi "access-control-allow-methods" /tmp/storage-preflight.txt
