name: TMC video processing
run-name: TMC video ${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: TMC job identifier
        required: true
        type: string
      object_key:
        description: Private Vercel Blob input path
        required: true
        type: string
      file_name:
        description: Original video filename
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tmc-video-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out TMC processing branch
        uses: actions/checkout@v4
        with:
          ref: feat/remove-supabase-vercel-gemini
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Blob SDK
        run: npm install --no-save --no-audit --no-fund @vercel/blob@2.4.0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install TMC renderer
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Render uploaded video
        working-directory: backend
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash-lite
        run: |
          python process_action.py \
            --job-id "${{ inputs.job_id }}" \
            --object-key "${{ inputs.object_key }}" \
            --file-name "${{ inputs.file_name }}"
